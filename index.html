<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>口 kǒu</title>
  <meta name="description" content="Type a Chinese word. A mouth spells it out, one pinyin letter at a time.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Crect x='8' y='8' width='16' height='16' fill='none' stroke='%23000' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">

  <form id="composer" autocomplete="off">
    <label class="sr-only" for="word">输入汉字 Type Chinese</label>
    <textarea id="word" rows="1" placeholder="口"
              enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus></textarea>

    <header class="hud hud-top">
      <h1 class="mark"><button id="home" type="button" title="重新开始 · Start over">口 <span>kǒu</span></button></h1>
      <p class="hint">输入汉字，按回车<br><span>Type Chinese, press Enter</span></p>
    </header>

    <footer class="hud hud-bottom">
      <div class="left">
        <nav class="examples" aria-label="示例 Examples">
          <button type="button" data-word="咬文嚼字">咬文嚼字</button>
          <button type="button" data-word="异口同声">异口同声</button>
          <button type="button" data-word="字正腔圆">字正腔圆</button>
          <button type="button" data-word="口是心非">口是心非</button>
          <button type="button" data-word="张口结舌">张口结舌</button>
          <button type="button" data-word="吞吞吐吐">吞吞吐吐</button>
          <button type="button" data-word="口口相传">口口相传</button>
          <button type="button" data-word="哑口无言">哑口无言</button>
          <button type="button" data-word="三缄其口">三缄其口</button>
          <button type="button" data-word="百口莫辩">百口莫辩</button>
        </nav>
        <p id="readout" class="readout" aria-live="polite"></p>
      </div>
      <button id="go" class="go" type="submit">播放 <span>Play</span></button>
    </footer>
  </form>

  <div id="stage" class="stage" aria-hidden="true"></div>

  <script src="vendor/pinyin-pro.js"></script>
  <script src="assets/sheets/manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
